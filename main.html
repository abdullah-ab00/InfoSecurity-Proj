<!DOCTYPE html>
<html lang="en">
<head>
    <title>PQC Operations</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="{{url_for ('static', filename = 'css/bootstrap.min.css')}}" rel="stylesheet">
    <link href="{{url_for ('static', filename = 'css/font-awesome.min.css')}}" rel="stylesheet">
    <link href="{{url_for ('static', filename = 'css/aos.css')}}" rel="stylesheet">
    <link href="{{url_for ('static', filename = 'css/owl.carousel.min.css')}}" rel="stylesheet">
    <link href="{{url_for ('static', filename = 'css/owl.theme.default.min.css')}}" rel="stylesheet">
    <link href="{{url_for ('static', filename = 'css/templatemo-digital-trend.css')}}" rel="stylesheet">

    <style>
        
    /* Generate Keys Button (Blue) */
    button[onclick="generateKeys()"] {
        border: 2px solid #007bff !important; /* Primary blue */
        color: #007bff !important;
        background: transparent !important;
        transition: all 0.3s ease;
    }

    /* Encrypt Button (Green) */
    button[onclick="encryptMessage()"] {
        border: 2px solid #28a745 !important; /* Success green */
        color: #28a745 !important;
        background: transparent !important;
        transition: all 0.3s ease;
    }

    /* Decrypt Button (Red) */
    button[onclick="decryptMessage()"] {
        border: 2px solid #dc3545 !important; /* Danger red */
        color: #dc3545 !important;
        background: transparent !important;
        transition: all 0.3s ease;
    }

    /* Hover Effects */
    button[onclick="generateKeys()"]:hover {
        background: #007bff !important;
        color: white !important;
    }

    button[onclick="encryptMessage()"]:hover {
        background: #28a745 !important;
        color: white !important;
    }

    button[onclick="decryptMessage()"]:hover {
        background: #dc3545 !important;
        color: white !important;
    }

        .crypto-card {
            border-radius: 15px;
            transition: transform 0.3s ease;
            background: linear-gradient(145deg, #ffffff, #f8f9fa);
        }

        .crypto-card:hover {
            transform: translateY(-5px);
        }

        .key-field, .result-field {
            background-color: #f8f9fa;
            border: 2px dashed #dee2e6;
            font-family: monospace;
            font-size: 0.9rem;
        }

        .alert {
            border-radius: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- MENU BAR -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="/home">
              <i class="fa fa-line-chart"></i>
              Post-Quantum Cryptography
            </a>

            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item">
                        <a href="/main" class="nav-link contact">Get Started</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Operations Section -->
    <section class="hero d-flex justify-content-center align-items-center" style="padding: 5rem 0;">
        <div class="container">
            <div class="row" data-aos="fade-up">
                
                <!-- Key Generation Card -->
                <div class="col-md-4 mb-4">
                    <div class="card shadow-lg crypto-card">
                        <div class="card-body">
                            <h3 class="card-title text-primary">🔑 Key Pair Generation</h3>
                            <button class="custom-btn btn-bg btn mt-3 w-100" 
                                    onclick="generateKeys()">
                                Generate Keys
                            </button>
                            <div class="key-display mt-4">
                                <div class="form-group">
                                    <label>Public Key</label>
                                    <textarea class="form-control key-field" 
                                              id="publicKey" 
                                              rows="3" 
                                              readonly></textarea>
                                </div>
                                <div class="form-group">
                                    <label>Private Key</label>
                                    <textarea class="form-control key-field" 
                                              id="privateKey" 
                                              rows="3" 
                                              readonly></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Encryption Card -->
                <div class="col-md-4 mb-4">
                    <div class="card shadow-lg crypto-card">
                        <div class="card-body">
                            <h3 class="card-title text-success">🔒 Encryption</h3>
                            <div class="form-group">
                                <textarea class="form-control" 
                                          id="plainText" 
                                          rows="3" 
                                          placeholder="Enter message to encrypt"></textarea>
                            </div>
                            <button class="custom-btn btn-bg btn mt-3 w-100" 
                                    onclick="encryptMessage()">
                                Encrypt Message
                            </button>
                            <div class="result-display mt-4">
                                <label>Encrypted Message</label>
                                <textarea class="form-control result-field" 
                                          id="cipherText" 
                                          rows="3" 
                                          readonly></textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Decryption Card -->
                <div class="col-md-4 mb-4">
                    <div class="card shadow-lg crypto-card">
                        <div class="card-body">
                            <h3 class="card-title text-danger">🔓 Decryption</h3>
                            <div class="form-group">
                                <textarea class="form-control" 
                                          id="cipherInput" 
                                          rows="3" 
                                          placeholder="Enter cipher text to decrypt"></textarea>
                            </div>
                            <button class="custom-btn btn-bg btn mt-3 w-100" 
                                    onclick="decryptMessage()">
                                Decrypt Message
                            </button>
                            <div class="result-display mt-4">
                                <label>Decrypted Message</label>
                                <textarea class="form-control result-field" 
                                          id="plainResult" 
                                          rows="3" 
                                          readonly></textarea>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Status Messages -->
            <div class="row">
                <div class="col-md-12">
                    <div id="alertBox" class="alert" style="display: none;"></div>
                </div>
            </div>
        </div>
    </section>

    <footer class="site-footer">
        <div class="container">
          <div class="row">
            <div class="col-lg-5 mx-lg-auto col-md-8 col-10">
              <h1 class="text-white" data-aos="fade-up" data-aos-delay="100">Simple. <strong>Secure.</strong> Quantum-proof.</h1>
            </div>
            <div class="col-lg-3 col-md-6 col-12" data-aos="fade-up" data-aos-delay="200">
              <h4 class="my-4">Contact Info</h4>
              <p class="mb-1">
                <i class="fa fa-phone mr-2 footer-icon"></i> 
                +92 123 456 789
              </p>
              <p>
                <a href="#">
                  <i class="fa fa-envelope mr-2 footer-icon"></i>
                  i210320@nu.edu.pk
                </a>
              </p>
            </div>
          </div>
        </div>
      </footer>

      <script>
        AOS.init({ duration: 1000, once: true });
    
        async function postData(url, data) {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
    
            if (!response.ok) {
                const text = await response.text();
                throw new Error(`Server error: ${text}`);
            }
    
            return response.json();
        }
    
        async function generateKeys() {
            try {
                const response = await postData('/keygen', {});
                document.getElementById('publicKey').value = response.public;
                document.getElementById('privateKey').value = response.private;
                showAlert('Key pair generated successfully!', 'success');
            } catch (error) {
                showAlert(error.message || 'Key generation failed', 'danger');
            }
        }
    
        async function encryptMessage() {
    const publicKey = document.getElementById('publicKey').value;
    const plainText = document.getElementById('plainText').value;

    if (!publicKey || !plainText) {
        showAlert('Please generate keys and enter a message', 'danger');
        return;
    }

    try {
        const response = await postData('/encrypt', {
            publicKey: publicKey,
            message: plainText
        });

        console.log("Encrypt response:", response);  // Should show ciphertext
        if (!response.ciphertext) {
            throw new Error('No "ciphertext" returned from server.');
        }

        // Save the complete ciphertext (Kyber + IV + AES)
        document.getElementById('cipherText').value = response.ciphertext;
        showAlert('Encryption successful!', 'success');
    } catch (error) {
        showAlert(error.message || 'Encryption failed', 'danger');
    }
}

    
        async function decryptMessage() {
            const privateKey = document.getElementById('privateKey').value;
            const cipherInput = document.getElementById('cipherInput').value;
    
            if (!privateKey || !cipherInput) {
                showAlert('Please enter the private key and ciphertext', 'danger');
                return;
            }
    
            try {
                const response = await postData('/decrypt', {
                    privateKey: privateKey,
                    ciphertext: cipherInput
                });
    
                console.log("Decrypt response:", response);  // DEBUG
    
                if (!response.secret) {
                    throw new Error('No "secret" field in response');
                }
    
                document.getElementById('plainResult').value = response.secret;
                showAlert('Decryption successful!', 'success');
            } catch (error) {
                showAlert(error.message || 'Decryption failed', 'danger');
            }
        }
    
        function showAlert(message, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.style.display = 'block';
            alertBox.className = `alert alert-${type}`;
            alertBox.innerHTML = message;
            setTimeout(() => alertBox.style.display = 'none', 5000);
        }
    </script>
    

    <script src="{{url_for ('static', filename = 'js/jquery.min.js')}}"></script>
    <script src="{{url_for ('static', filename = 'js/bootstrap.min.js')}}"></script>
    <script src="{{url_for ('static', filename = 'js/aos.js')}}"></script>
    <script src="{{url_for ('static', filename = 'js/owl.carousel.min.js')}}"></script>
    <script src="{{url_for ('static', filename = 'js/smoothscroll.js')}}"></script>
    <script src="{{url_for ('static', filename = 'js/custom.js')}}"></script>
</body>
</html>
